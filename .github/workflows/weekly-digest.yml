name: Weekly Competitor Digest

on:
  schedule:
    # Every Sunday at 05:00 UTC = 08:00 AM Riyadh time (UTC+3)
    - cron: '0 5 * * 0'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python competitor_tracker.py

      - name: Get today's date
        id: today
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Email the digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Competitor Tracker <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Weekly Competitor Digest — ${{ steps.today.outputs.date }}"
          body: "This week's competitor update digest is attached."
          attachments: digests/digest-${{ steps.today.outputs.date }}.docx

      - name: Commit digest and state
        run: |
          git config user.name "competitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json digests/
          git commit -m "Weekly competitor digest $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # Pull any commits made to main since this job checked it out,
          # then retry the push once before giving up.
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Upload digest as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitor-digest
          path: digests/
